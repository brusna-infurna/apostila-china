<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Diário de Bordo · China — Bruna Infurna</title>
<meta name="description" content="Apostila China · Cultura, História, Tech, Negócios, Geopolítica e Sociedade. Preparada para a viagem set/2026.">
<meta name="theme-color" content="#FAFAF7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Light editorial — off-white paper, deep ink, crimson accent used with parsimony */
  --paper:#FAFAF7;
  --paper-2:#F5F4EF;
  --paper-3:#EFEDE6;
  --card:#FFFFFF;
  --ink:#1A1A1A;
  --ink-2:#2B2B2B;
  --ink-3:#4A4A4A;
  --muted:#6B6B6B;
  --faint:#9A9A9A;
  --line:#E5E3DC;
  --line-2:#EFEDE6;
  --line-3:#D6D3CB;

  --accent:#B91C1C;          /* crimson, used in parsimony */
  --accent-soft:#DC2626;
  --accent-faint:rgba(185,28,28,0.08);
  --jade:#3F6B5E;            /* used only in AI Atlas chips */

  --shadow-xs:0 1px 2px rgba(20,20,20,0.04);
  --shadow-sm:0 1px 3px rgba(20,20,20,0.06), 0 1px 2px rgba(20,20,20,0.04);
  --shadow-md:0 4px 16px rgba(20,20,20,0.06), 0 2px 4px rgba(20,20,20,0.04);
  --shadow-lg:0 12px 40px rgba(20,20,20,0.08), 0 4px 12px rgba(20,20,20,0.04);

  --serif:'Fraunces','Charter','Georgia',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --cjk:'PingFang SC','Hiragino Sans GB','Noto Sans SC',var(--serif);

  --sidebar-w:280px;
  --content-w:680px;
  --ease:cubic-bezier(0.22,0.61,0.36,1);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:19px;
  line-height:1.7;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-feature-settings:"kern","liga","calt";
}
.zh{font-family:var(--cjk);font-weight:400}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#fff}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}

/* ============== SKIP LINK (a11y) ============== */
.skip{position:absolute;left:-9999px;top:8px;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;font-family:var(--sans);font-size:14px;font-weight:600;z-index:200}
.skip:focus{left:8px}

/* ============== PROGRESS BAR ============== */
#progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:120;transition:width .15s linear}

/* ============== TOPBAR ============== */
#topbar{
  position:fixed;top:0;left:0;right:0;height:64px;z-index:100;
  display:flex;align-items:center;gap:18px;padding:0 28px;
  background:rgba(250,250,247,0.85);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
}
#topbar .brand{display:flex;align-items:center;gap:12px;cursor:pointer}
#topbar .brand .cn{font-family:var(--cjk);color:var(--accent);font-size:24px;font-weight:500;letter-spacing:.04em}
#topbar .brand .lbl{font-family:var(--sans);font-size:11px;text-transform:uppercase;letter-spacing:.22em;color:var(--muted);font-weight:600}
#menuBtn{display:none;background:none;border:0;font-size:22px;color:var(--ink);padding:6px 8px;border-radius:6px}
#menuBtn:hover{background:var(--paper-2)}
.spacer{flex:1}
.search-wrap{position:relative;width:min(360px,38vw)}
#search{
  width:100%;
  padding:10px 16px 10px 40px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  outline:none;
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
}
#search:focus{
  border-color:var(--ink-3);
  box-shadow:0 0 0 3px rgba(26,26,26,0.06);
}
#search::placeholder{color:var(--faint)}
.search-wrap .ic{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--faint);font-size:14px;font-family:var(--sans);font-weight:600;pointer-events:none;
}
.kbd-hint{
  font-family:var(--sans);font-size:11px;color:var(--faint);
  border:1px solid var(--line);border-radius:5px;padding:2px 6px;
  position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;
}

/* ============== LAYOUT ============== */
#layout{display:flex;padding-top:64px;min-height:100vh}
#sidebar{
  position:fixed;top:64px;bottom:0;left:0;width:var(--sidebar-w);
  overflow-y:auto;
  border-right:1px solid var(--line);
  background:var(--paper);
  padding:28px 18px 80px;
}
#sidebar::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
#sidebar::-webkit-scrollbar-thumb:hover{background:var(--line-3)}

.nav-group{margin-bottom:24px}
.nav-group > .gh{
  font-family:var(--sans);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.22em;
  color:var(--faint);
  font-weight:700;
  padding:0 14px;
  margin-bottom:6px;
}
.nav-item{
  display:flex;align-items:baseline;gap:10px;
  padding:9px 14px;
  border-radius:8px;
  color:var(--ink-3);
  font-family:var(--sans);
  font-size:14.5px;
  line-height:1.35;
  font-weight:500;
  text-decoration:none;
  transition:background-color .15s var(--ease), color .15s var(--ease);
}
.nav-item:hover{background:var(--paper-2);color:var(--ink)}
.nav-item.active{background:var(--paper-2);color:var(--ink);font-weight:600}
.nav-item.active::before{
  content:"";display:inline-block;width:2px;height:14px;
  background:var(--accent);margin-right:-2px;margin-left:-6px;
  border-radius:1px;align-self:center;
}
.nav-item .num{
  font-family:var(--sans);font-size:11px;color:var(--faint);
  min-width:18px;font-weight:600;flex-shrink:0;
}
.nav-item.active .num{color:var(--accent)}
.nav-item .ic{font-size:13px;width:18px;text-align:center;flex-shrink:0;opacity:.7}

#main{margin-left:var(--sidebar-w);flex:1;min-width:0}
.page{max-width:var(--content-w);margin:0 auto;padding:64px 32px 160px}

/* ============== ARTICLE TYPOGRAPHY (NYT/Atlantic) ============== */
.kicker{
  font-family:var(--sans);
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:.24em;
  color:var(--accent);
  margin-bottom:18px;
  font-weight:700;
}
h1.sec-title{
  font-family:var(--serif);
  font-size:54px;
  line-height:1.05;
  letter-spacing:-.022em;
  margin:0 0 14px;
  font-weight:500;
  color:var(--ink);
  font-variation-settings:"opsz" 144;
}
.sec-sub{
  font-family:var(--serif);
  color:var(--muted);
  font-style:italic;
  font-size:22px;
  line-height:1.4;
  margin-bottom:0;
  font-weight:400;
}
.rule{height:1px;background:var(--line);margin:38px 0 36px;border:0}

.content h2{
  font-family:var(--serif);
  font-size:34px;
  line-height:1.18;
  margin:64px 0 16px;
  font-weight:500;
  letter-spacing:-.012em;
  scroll-margin-top:96px;
  color:var(--ink);
  font-variation-settings:"opsz" 144;
}
.content h3{
  font-family:var(--serif);
  font-size:24px;
  line-height:1.25;
  margin:44px 0 12px;
  font-weight:600;
  color:var(--ink);
  scroll-margin-top:96px;
}
.content h4{
  font-family:var(--sans);
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.14em;
  color:var(--ink-3);
  margin:36px 0 8px;
  font-weight:700;
  scroll-margin-top:96px;
}
.content p{margin:0 0 22px;color:var(--ink-2)}
.content p.lead{
  font-family:var(--serif);
  font-size:24px;
  line-height:1.5;
  color:var(--ink);
  font-weight:400;
  margin-bottom:30px;
  font-variation-settings:"opsz" 144;
}
.content strong{font-weight:600;color:var(--ink)}
.content em{font-style:italic}
.content a{color:var(--accent);border-bottom:1px solid var(--accent-faint);transition:border-color .15s var(--ease)}
.content a:hover{border-bottom-color:var(--accent)}

.content ul,.content ol{margin:0 0 24px;padding-left:24px}
.content li{margin:0 0 10px;padding-left:6px;color:var(--ink-2)}
.content ul li::marker{color:var(--accent);font-size:.85em}
.content ol li::marker{color:var(--accent);font-weight:600;font-family:var(--sans);font-size:.85em}

.content table{
  width:100%;
  border-collapse:collapse;
  margin:30px 0;
  font-family:var(--sans);
  font-size:14.5px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
}
.content thead th{
  background:var(--paper-2);
  color:var(--ink);
  text-align:left;
  padding:12px 16px;
  font-weight:600;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.06em;
  border-bottom:1px solid var(--line);
}
.content td{
  padding:12px 16px;
  border-top:1px solid var(--line-2);
  vertical-align:top;
  color:var(--ink-2);
  line-height:1.55;
}
.content tbody tr:hover td{background:var(--paper-2)}

.term{
  border-bottom:1px dotted var(--accent-soft);
  cursor:help;
  text-decoration:none;
}

/* Drop cap — only on first paragraph of article (lead) */
.content p.lead.dropcap::first-letter{
  font-family:var(--serif);
  float:left;
  font-size:84px;
  line-height:.85;
  padding:8px 14px 0 0;
  color:var(--accent);
  font-weight:600;
  font-variation-settings:"opsz" 144;
}

/* ============== ON-THIS-PAGE (right rail style, but inline at top for now) ============== */
.onpage{
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:20px 24px;
  margin:24px 0 12px;
  font-family:var(--sans);
}
.onpage .t{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.22em;
  color:var(--faint);
  margin-bottom:12px;
  font-weight:700;
}
.onpage a{
  display:block;
  color:var(--ink-3);
  padding:6px 0;
  font-size:14.5px;
  line-height:1.4;
  border-bottom:1px solid transparent;
  transition:color .15s var(--ease);
}
.onpage a:hover{color:var(--accent)}
.onpage a.lvl3{padding-left:18px;font-size:13.5px;color:var(--muted)}

/* ============== PREV / NEXT ============== */
.pager{
  display:flex;gap:16px;margin-top:80px;
  border-top:1px solid var(--line);padding-top:30px;
}
.pager a{
  flex:1;
  text-decoration:none;
  padding:20px 22px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card);
  transition:transform .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
  font-family:var(--sans);
}
.pager a:hover{
  border-color:var(--line-3);
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}
.pager .dir{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.18em;
  color:var(--faint);
  font-weight:600;
}
.pager .ti{
  display:block;margin-top:6px;
  color:var(--ink);font-weight:600;font-size:16px;
  font-family:var(--serif);
  line-height:1.3;
}
.pager .next{text-align:right}

/* ============== HOME / HERO ============== */
.hero{
  text-align:center;
  padding:32px 0 12px;
  max-width:680px;
  margin:0 auto;
}
.hero .cn{
  font-family:var(--cjk);
  font-size:96px;
  line-height:1;
  color:var(--accent);
  font-weight:300;
  letter-spacing:.06em;
}
.hero h1{
  font-family:var(--serif);
  font-size:32px;
  letter-spacing:.34em;
  text-transform:uppercase;
  margin:18px 0 6px;
  font-weight:500;
  padding-left:.34em;
  color:var(--ink);
}
.hero .sub{
  font-family:var(--serif);
  font-style:italic;
  color:var(--muted);
  font-size:22px;
  font-weight:400;
}
.hero .tag{
  font-family:var(--sans);
  font-size:13px;
  letter-spacing:.06em;
  color:var(--ink-3);
  margin-top:14px;
  font-weight:500;
}
.hero .meta-l{
  font-family:var(--sans);
  font-size:13px;
  color:var(--muted);
  margin-top:24px;
  line-height:1.75;
}

.countdown{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin:36px auto 18px;
  max-width:540px;
}
.cd-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:24px 12px;
  text-align:center;
  transition:transform .2s var(--ease), box-shadow .2s var(--ease);
}
.cd-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.cd-card .big{
  font-family:var(--serif);
  font-size:52px;
  font-weight:500;
  color:var(--ink);
  line-height:1;
  font-variation-settings:"opsz" 144;
  letter-spacing:-.02em;
}
.cd-card .lbl{
  font-family:var(--sans);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.14em;
  color:var(--muted);
  margin-top:10px;
  font-weight:600;
}

.route{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin:24px 0 8px;
}
.route .stop{
  font-family:var(--sans);
  font-size:13px;
  font-weight:500;
  background:var(--card);
  border:1px solid var(--line);
  padding:8px 16px;
  border-radius:999px;
  color:var(--ink-3);
}
.route .stop b{color:var(--accent);font-weight:600}
.route .arrow{color:var(--faint);align-self:center;font-family:var(--sans);font-size:14px}

.resume{
  display:inline-block;
  margin:14px auto 0;
  font-family:var(--sans);
  font-size:14px;
  font-weight:600;
  background:var(--ink);
  color:var(--paper);
  border:0;
  padding:12px 26px;
  border-radius:999px;
  text-decoration:none;
  transition:transform .2s var(--ease), background-color .2s var(--ease);
}
.resume:hover{background:var(--accent);transform:translateY(-1px)}

.downloads{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  margin-top:20px;
}
.dl{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--sans);
  font-size:13px;
  font-weight:500;
  text-decoration:none;
  color:var(--ink-3);
  background:transparent;
  border:1px solid var(--line);
  padding:10px 18px;
  border-radius:999px;
  transition:all .2s var(--ease);
}
.dl:hover{border-color:var(--ink-3);color:var(--ink);transform:translateY(-1px)}

.subscribe-hero{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.sub-btn{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--sans);font-size:14px;font-weight:600;text-decoration:none;
  color:#fff;background:var(--accent);
  padding:12px 26px;border-radius:999px;
  transition:all .2s var(--ease);
}
.sub-btn:hover{background:var(--accent-soft);transform:translateY(-1px)}
.sub-note{font-family:var(--sans);font-size:12.5px;color:var(--ink-3)}
.sub-top{
  display:inline-flex;align-items:center;
  font-family:var(--sans);font-size:13px;font-weight:600;text-decoration:none;
  color:#fff;background:var(--accent);
  padding:7px 16px;border-radius:999px;margin-left:10px;white-space:nowrap;
  transition:all .2s var(--ease);
}
.sub-top:hover{background:var(--accent-soft)}
@media(max-width:720px){.sub-top{display:none}}

.dl b{color:var(--ink);font-weight:600}

.section-h{
  font-family:var(--sans);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.24em;
  color:var(--faint);
  margin:72px 0 24px;
  display:flex;
  align-items:center;
  gap:18px;
  font-weight:700;
}
.section-h::after{content:"";flex:1;height:1px;background:var(--line)}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:24px 22px 20px;
  cursor:pointer;
  transition:transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
  text-decoration:none;
  color:inherit;
  display:flex;
  flex-direction:column;
  min-height:160px;
}
.card:hover{
  border-color:var(--line-3);
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}
.card .k{
  font-family:var(--sans);
  font-size:10.5px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--accent);
  font-weight:700;
}
.card .ti{
  font-family:var(--serif);
  font-size:21px;
  font-weight:500;
  margin:10px 0 10px;
  line-height:1.22;
  color:var(--ink);
  letter-spacing:-.005em;
}
.card .pv{
  font-family:var(--sans);
  font-size:13px;
  color:var(--muted);
  line-height:1.55;
  margin-top:auto;
}

.minicards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:14px;
}
.minicard{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:22px 20px;
  cursor:pointer;
  text-decoration:none;
  color:inherit;
  transition:transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
}
.minicard:hover{
  border-color:var(--line-3);
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}
.minicard .cn{font-family:var(--cjk);font-size:26px;color:var(--accent);font-weight:400}
.minicard .ti{font-family:var(--serif);font-size:18px;font-weight:600;margin-top:8px;color:var(--ink)}
.minicard .ds{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}

/* ============== GLOSSARY ============== */
.gloss-controls{
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  margin:24px 0 14px;
}
#glossSearch{
  flex:1;min-width:220px;
  padding:11px 16px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  outline:none;
}
#glossSearch:focus{border-color:var(--ink-3);box-shadow:0 0 0 3px rgba(26,26,26,0.06)}
.alpha{display:flex;flex-wrap:wrap;gap:4px}
.alpha button{
  font-family:var(--sans);
  font-size:12px;
  font-weight:600;
  width:28px;height:28px;
  border-radius:6px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--muted);
  transition:all .15s var(--ease);
}
.alpha button:hover{background:var(--paper-2);color:var(--ink);border-color:var(--line-3)}
.alpha button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.gloss-item{
  border-bottom:1px solid var(--line);
  padding:18px 0;
}
.gloss-item .term-h{
  font-family:var(--serif);
  font-weight:600;
  font-size:20px;
  color:var(--ink);
  letter-spacing:-.005em;
}
.gloss-item .zhp{
  font-family:var(--cjk);
  color:var(--accent);
  margin-left:10px;
  font-weight:400;
  font-size:18px;
}
.gloss-item .py{
  font-family:var(--serif);
  font-style:italic;
  color:var(--muted);
  font-size:15px;
  margin-left:8px;
}
.gloss-item .def{
  color:var(--ink-2);
  margin-top:6px;
  font-size:16.5px;
  line-height:1.6;
}
.alpha-head{
  font-family:var(--sans);
  font-size:11px;
  font-weight:700;
  color:var(--accent);
  letter-spacing:.22em;
  margin:32px 0 4px;
}

/* ============== TIMELINE ============== */
.tl-era{
  margin:38px 0 8px;
  font-size:11px;
  font-family:var(--sans);
  font-weight:700;
  letter-spacing:.22em;
  color:var(--accent);
  text-transform:uppercase;
}
.tl{
  border-left:1px solid var(--line-3);
  margin-left:8px;
  padding-left:26px;
}
.tl-item{position:relative;padding:10px 0 16px}
.tl-item::before{
  content:"";
  position:absolute;
  left:-32px;
  top:18px;
  width:9px;height:9px;
  border-radius:50%;
  background:var(--accent);
  border:2px solid var(--paper);
}
.tl-item .yr{
  font-family:var(--sans);
  font-weight:700;
  color:var(--ink);
  font-size:14px;
}

/* ============== LIVE / ATUALIDADES ============== */
.live-banner{

.live-banner .when{

  font-size:11px;

  display:flex;
  align-items:center;

}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 0 var(--accent);
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(185,28,28,0.55)}
  70%{box-shadow:0 0 0 8px transparent}

.live-banner .intro{

}
.live-cat{margin-top:36px}
.live-cat h2{

  align-items:center;
  gap:12px;
  margin:0 0 6px;

  color:var(--ink);
}
.live-cat h2 .cn{font-family:var(--cjk);font-size:18px;color:var(--accent);font-weight:400}
.live-item{
  background:var(--card);
  border:1px solid var(--line);

.live-item:hover{border-color:var(--line-3);transform:translateY(-1px)}
.live-item .ti{
  font-family:var(--serif);
  font-weight:600;

}
.live-item .tx{
  color:var(--ink-2);

}
.live-item .src{

}
.live-item .src a{color:var(--accent);border-bottom:1px solid var(--accent-faint)}
.live-item .src a:hover{border-bottom-color:var(--accent)}

/* ============== AI ATLAS — special hero in Apêndice C ============== */
.atlas-hero{
  background:var(--paper-2);

  border-radius:14px;
  padding:32px 28px;
  margin:24px 0 32px;
}
.atlas-hero .eyebrow{
  font-family:var(--sans);
  font-size:11px;

}
.atlas-hero .lede{
  font-family:var(--serif);

  line-height:1.5;

}
.atlas-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;

}
.atlas-stat{text-align:left}
.atlas-stat .num{
  font-family:var(--serif);
  font-size:44px;
  font-weight:500;

  font-variation-settings:"opsz" 144;
  letter-spacing:-.02em;
}
.atlas-stat .num .suffix{font-size:.55em;color:var(--accent);margin-left:2px;font-weight:600}
.atlas-stat .num .prefix{font-size:.55em;color:var(--accent);margin-right:2px;font-weight:600}
.atlas-stat .lbl{
  font-family:var(--sans);

/* ============== SEARCH OVERLAY ============== */
#searchOverlay{
  position:fixed;inset:64px 0 0 0;z-index:90;
  background:rgba(250,250,247,0.75);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);

}
#searchOverlay.show{display:flex}
.search-panel{
  width:min(720px,92vw);
  max-height:calc(100vh - 120px);
  overflow-y:auto;
  background:var(--card);
  border:1px solid var(--line);

  margin-top:24px;

.sr-meta{
  font-family:var(--sans);

}
.sr{
  display:block;
  padding:14px 16px;

}
.sr:hover,.sr.kbd{background:var(--paper-2)}

  font-size:11px;

}
.sr .snip{
  font-family:var(--serif);
  font-size:16px;
  color:var(--ink-2);

.sr .snip mark{

.sr-empty{

/* ============== TOOLTIP ============== */
#tip{
  position:fixed;z-index:200;max-width:320px;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--sans);
  font-size:13px;line-height:1.5;
  padding:11px 14px;

}
#tip .tt{font-weight:700;display:block;margin-bottom:3px;color:#fff}

/* ============== FLASH (search-jump highlight) ============== */
.flash{animation:flash 1.8s ease}
@keyframes flash{
  0%,30%{background:rgba(185,28,28,0.12)}
  100%{background:transparent}
}

/* ============== SCRIM (mobile nav backdrop) ============== */
#scrim{display:none;position:fixed;inset:64px 0 0 0;background:rgba(0,0,0,0.32);z-index:79}

/* ============== REVEAL-ON-SCROLL ============== */
.reveal{
  opacity:0;
  transform:translateY(10px);
  transition:opacity .6s var(--ease), transform .6s var(--ease);
}
.reveal.in{opacity:1;transform:none}

/* Stagger children for grids */
.cards .card.reveal,
.minicards .minicard.reveal,
.countdown .cd-card.reveal{

}

/* ============== RESPONSIVE ============== */
@media(max-width:980px){
  :root{--sidebar-w:260px;--content-w:100%}
  #menuBtn{display:block}
  #sidebar{
    transform:translateX(-100%);
    transition:transform .25s var(--ease);

    box-shadow:var(--shadow-lg);
  }
  body.nav-open #sidebar{transform:none}

  #main{margin-left:0}

  #topbar{padding:0 18px;gap:12px}
  h1.sec-title{font-size:42px}
  .content h2{font-size:28px;margin:48px 0 14px}
  .content h3{font-size:20px}
  .content p.lead{font-size:21px}
  .page{padding:48px 22px 120px}
  .countdown{grid-template-columns:repeat(3,1fr);gap:10px}
  .cd-card{padding:18px 8px}
  .cd-card .big{font-size:38px}
  .atlas-stats{grid-template-columns:1fr;gap:20px}
}
@media(max-width:560px){
  body{font-size:17.5px;line-height:1.65}
  .hero .cn{font-size:72px}
  .hero h1{font-size:22px;letter-spacing:.26em}
  .hero .sub{font-size:18px}
  h1.sec-title{font-size:34px;line-height:1.1}
  .content h2{font-size:24px}
  .content p.lead{font-size:19px}
  .content p.lead.dropcap::first-letter{font-size:62px}
  .pager{flex-direction:column;gap:10px}
  .page{padding:36px 18px 100px}
  #topbar .brand .lbl{display:none}
  .countdown{grid-template-columns:repeat(3,1fr)}
  .cd-card .big{font-size:32px}

}

/* ============== PRINT ============== */
@media print{
  #topbar,#sidebar,#scrim,.pager,#progress,.downloads,.resume{display:none!important}
  #main{margin-left:0}

/* ============== REDUCED MOTION ============== */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .reveal{opacity:1;transform:none}
}

<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<div id="progress"></div>

<div id="topbar">
  <button id="menuBtn" aria-label="Abrir menu">☰</button>
  <a class="brand" href="#/inicio" aria-label="Início">
    <span class="cn">中国</span><span class="lbl">Diário de Bordo</span>
  </a>
  <div class="spacer"></div>
  <div class="search-wrap">
    <span class="ic">⌕</span>
    <input id="search" placeholder="Buscar na apostila…" autocomplete="off" aria-label="Buscar">
    <span class="kbd-hint">/</span>
  </div>
  <a class="sub-top" href="https://www.linkedin.com/newsletters/di%C3%A1rio-de-bordo-before-7478251094402297856/" target="_blank" rel="noopener">Assinar</a>
</div>

<div id="layout">
  <nav id="sidebar" aria-label="Navegação"></nav>
  <div id="scrim"></div>
  <main id="main"><div class="page" id="content"></div></main>
</div>

<div id="searchOverlay"><div class="search-panel" id="searchPanel"></div></div>
<div id="tip" role="tooltip"></div>

<script id="apostila-data" type="application/json">__APOSTILA__</script>
<script id="live-data" type="application/json">__LIVE__</script>
<script>
"use strict";
const APOSTILA = JSON.parse(document.getElementById('apostila-data').textContent);
let LIVE = JSON.parse(document.getElementById('live-data').textContent);
const SEC = APOSTILA.sections;
const byId = Object.fromEntries(SEC.map(s=>[s.id,s]));
const AI_ATLAS_ID = 'apendice-c-china-ai-atlas-tech-buzz-china';
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- glossary maps ---- */
const zhMap={};
APOSTILA.glossary.forEach(g=>{ if(g.zh) zhMap[g.zh]=g; });

/* ---- helpers ---- */
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const CJK=/([㐀-鿿豈-﫿぀-ゟ゠-ヿ＀-￯]+)/g;

function wrapCJK(html){
  return html.replace(CJK,(m)=>{
    const g=zhMap[m];
    if(g) return `<span class="zh term" data-def="${esc(g.term+' — '+g.def)}" data-tt="${esc(g.term)}">${m}</span>`;
    return `<span class="zh">${m}</span>`;
  });
}
function runsHTML(runs){
  if(!runs||!runs.length) return '';
  return runs.map(r=>{
    let t=wrapCJK(esc(r.t));
    if(r.b) t=`<strong>${t}</strong>`;
    if(r.i) t=`<em>${t}</em>`;
    return t;
  }).join('');
}

function renderBlocks(blocks, sid){
  let html='', i=0, firstP=true;
  while(i<blocks.length){
    const b=blocks[i];
    const bid=`b-${sid}-${i}`;
    if(b.type==='li'){
      let j=i, items=[];
      while(j<blocks.length && blocks[j].type==='li'){ items.push({b:blocks[j],idx:j}); j++; }
      html+=buildList(items, sid);
      i=j; continue;
    }
    if(b.type==='h'){
      const tag='h'+Math.min(Math.max(b.level,2),4);
      html+=`<${tag} id="${b.id||bid}">${runsHTML(b.runs)||esc(b.text)}</${tag}>`;
    }else if(b.type==='p'){
      const lead = firstP ? ' lead dropcap' : '';
      html+=`<p id="${bid}" class="${lead.trim()}">${runsHTML(b.runs)||esc(b.text)}</p>`;
      firstP=false;
    }else if(b.type==='table'){
      html+=buildTable(b, bid);
    }
    i++;
  }
  return html;
}
function buildList(items, sid){
  let out='', stack=[];
  function open(ind,ord){ out+= ord?'<ol>':'<ul>'; stack.push({ind,ord}); }
  function close(){ const s=stack.pop(); out+= s.ord?'</ol>':'</ul>'; }
  items.forEach(({b,idx})=>{
    const ind=b.indent||0, ord=!!b.ordered;
    while(stack.length && stack[stack.length-1].ind>ind) close();
    if(!stack.length || stack[stack.length-1].ind<ind) open(ind,ord);
    out+=`<li id="b-${sid}-${idx}">${runsHTML(b.runs)||esc(b.text)}</li>`;
  });
  while(stack.length) close();
  return out;
}
function buildTable(b,bid){
  const rows=b.rows; if(!rows||!rows.length) return '';
  let h=`<table id="${bid}"><thead><tr>`+rows[0].map(c=>`<th>${wrapCJK(esc(c))}</th>`).join('')+`</tr></thead><tbody>`;
  for(let r=1;r<rows.length;r++){ h+='<tr>'+rows[r].map(c=>`<td>${wrapCJK(esc(c)).replace(/\n/g,'<br>')}</td>`).join('')+'</tr>'; }
  return h+'</tbody></table>';
}

const ORDER = SEC.filter(s=>!/APÊNDICE A|APÊNDICE B/.test(s.raw||''));

function navList(){
  const groups=[
    {h:null, items:[{id:'inicio',ic:'⌂',label:'Início'},{id:'atualidades',ic:'●',label:'Atualidades'}]},
  ];
  const ab=SEC.filter(s=>s.group==='abertura');
  const cap=SEC.filter(s=>s.group==='capitulos');
  const en=SEC.filter(s=>s.group==='encerramento');
  groups.push({h:'Abertura',items:ab.map(s=>({id:s.id,label:s.label||s.title,num:''}))});
  groups.push({h:'Capítulos',items:cap.map(s=>({id:s.id,label:s.title,num:(s.label||'').replace(/\D/g,'')}))});
  groups.push({h:'Encerramento',items:en.map(s=>({id:s.id,label:s.title,num:''}))});
  const apC = byId[AI_ATLAS_ID];
  groups.push({h:'Referência',items:[
    {id:'glossario',ic:'❦',label:'Glossário ('+APOSTILA.glossary.length+')'},
    {id:'cronologia',ic:'❘',label:'Cronologia'},
    ...(apC ? [{id:apC.id, ic:'+', label:'China AI Atlas'}] : [])
  ]});
  return groups;
}
function buildSidebar(){
  const el=document.getElementById('sidebar');
  el.innerHTML=navList().map(g=>{
    const items=g.items.map(it=>{
      const numH = it.num!==undefined && it.num!=='' ? `<span class="num">${it.num}</span>` : (it.ic?`<span class="ic">${it.ic}</span>`:`<span class="num"></span>`);
      return `<a class="nav-item" data-id="${it.id}" href="#/${it.id}">${numH}<span>${esc(it.label)}</span></a>`;
    }).join('');
    return `<div class="nav-group">${g.h?`<div class="gh">${g.h}</div>`:''}${items}</div>`;
  }).join('');
}

/* ---- routing ---- */
let CURRENT='inicio';
let pendingAnchor=null;
function go(id, anchor){ pendingAnchor=anchor||null; location.hash='#/'+id; }
function parseHash(){
  const h=location.hash.replace(/^#\/?/,'');
  return h||'inicio';
}
function setActive(id){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.id===id));
}
function render(){
  const id=parseHash();
  CURRENT=id;
  const c=document.getElementById('content');
  if(id==='inicio') c.innerHTML=renderHome();
  else if(id==='atualidades'){ c.innerHTML=renderLive(); }
  else if(id==='glossario') c.innerHTML=renderGlossary();
  else if(id==='cronologia') c.innerHTML=renderTimeline();
  else if(byId[id]) c.innerHTML=renderSection(byId[id]);
  else c.innerHTML=renderHome();
  setActive(id);
  if(id!=='inicio'){ try{localStorage.setItem('china_last', id);}catch(e){} }
  closeNav();
  window.scrollTo(0,0);
  if(pendingAnchor){ const t=pendingAnchor; pendingAnchor=null; setTimeout(()=>scrollToEl(t),60); }
  attachExtras();
  observeReveals();
}
function scrollToEl(elId){
  const el=document.getElementById(elId);
  if(!el) return;
  const y=el.getBoundingClientRect().top+window.scrollY-84;
  window.scrollTo({top:y,behavior:'smooth'});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

/* ---- section view ---- */
function renderSection(s){
  const kicker = s.label ? s.label : (s.group==='apendices'?'Apêndice':'');
  const h2s=s.toc?s.toc.filter(t=>t.level===2):[];
  let onpage='';
  if(h2s.length>3){
    onpage=`<div class="onpage reveal"><div class="t">Nesta seção</div>`+
      s.toc.filter(t=>t.level<=3).map(t=>`<a class="${t.level===3?'lvl3':''}" href="#" onclick="scrollToEl('${t.id}');return false;">${esc(t.title)}</a>`).join('')+`</div>`;
  }
  const idx=ORDER.findIndex(x=>x.id===s.id);
  const prev=ORDER[idx-1], next=ORDER[idx+1];
  const pager=`<div class="pager">`+
    (prev?`<a href="#/${prev.id}"><span class="dir">‹ Anterior</span><span class="ti">${esc(prev.label||prev.title)}</span></a>`:`<span style="flex:1"></span>`)+
    (next?`<a class="next" href="#/${next.id}"><span class="dir">Próximo ›</span><span class="ti">${esc(next.label||next.title)}</span></a>`:`<span style="flex:1"></span>`)+
  `</div>`;

  // Special intro hero for AI Atlas (Apêndice C)
  let specialHero='';
  if(s.id===AI_ATLAS_ID){
    specialHero = `<div class="atlas-hero reveal">
      <div class="eyebrow">Atlas adaptado · Tech Buzz China · jun/2026</div>
      <p class="lede">Quem está movendo a fronteira da IA na China hoje. Onze labs ativos, sessenta e um pesquisadores mapeados, mais de duzentos bilhões de dólares de valor concentrado em uma geração formada entre MSRA, Tsinghua e a diáspora de Stanford.</p>
      <div class="atlas-stats">
        <div class="atlas-stat">
          <div class="num"><span class="prefix">US$</span><span data-count="223" data-suffix="B">0</span></div>
          <div class="lbl">Valor mapeado</div>
          <div class="ds">Soma de valuations e run-rates dos 11 labs ativos</div>
        </div>
        <div class="atlas-stat">
          <div class="num"><span data-count="11">0</span></div>
          <div class="lbl">Labs ativos</div>
          <div class="ds">Dos 12 originais do atlas, 10 seguem na corrida, 2 pivotaram</div>
        </div>
        <div class="atlas-stat">
          <div class="num"><span data-count="61">0</span></div>
          <div class="lbl">Pesquisadores</div>
          <div class="ds">Mapeados por trait, lab, score e papel na cadeia técnica</div>
        </div>
      </div>
    </div>`;
  }

  return `<article>
    ${kicker?`<div class="kicker">${esc(kicker)}</div>`:''}
    <h1 class="sec-title">${esc(s.title)}</h1>
    <hr class="rule">
    ${specialHero}
    ${onpage}
    <div class="content">${renderBlocks(s.blocks,s.id)}</div>
    ${pager}
  </article>`;
}

/* ---- home ---- */
function daysToTrip(){
  const t=new Date(APOSTILA.meta.tripStart+'T00:00:00');
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.max(0, Math.round((t-now)/86400000));
}
function renderHome(){
  const m=APOSTILA.meta;
  const d=daysToTrip();

  const cap=SEC.filter(s=>s.group==='capitulos');

  return `<div class="hero">

      <div class="cd-card reveal" style="--i:1"><div class="big" data-count="${SEC.filter(s=>s.group==='capitulos').length}">0</div><div class="lbl">capítulos</div></div>
      <div class="cd-card reveal" style="--i:2"><div class="big" data-count="${APOSTILA.glossary.length}">0</div><div class="lbl">termos no glossário</div></div>
    </div>
    <div class="route reveal">${route}</div>
    <div class="meta-l reveal">${esc(m.dates)} · ${esc(m.version)}<br>${esc(m.prepared)}</div>
    <div class="downloads reveal">
      <a class="dl" href="exports/apostila-china.pdf" download>↓ <b>PDF</b> · 110 págs</a>
      <a class="dl" href="exports/apostila-china.epub" download>↓ <b>EPUB</b> · Kindle</a>
    </div>
    <div class="subscribe-hero reveal">
      <a class="sub-btn" href="https://www.linkedin.com/newsletters/di%C3%A1rio-de-bordo-before-7478251094402297856/" target="_blank" rel="noopener">Assinar o Diário de Bordo</a>
      <span class="sub-note">Newsletter no LinkedIn · nova edição toda terça, até o embarque</span>
    </div>
    ${lastSec?`<div style="margin-top:22px"><a class="resume reveal" href="#/${lastSec.id}">Continuar: ${esc(lastSec.label||lastSec.title)} →</a></div>`:''}
  </div>
  <div class="section-h">Capítulos</div>
  <div class="cards">${cards}</div>
  <div class="section-h">Referência & atual</div>

    <a class="minicard reveal" style="--i:0" href="#/atualidades"><div class="cn">今日</div><div class="ti">Atualidades</div><div class="ds">Panorama atual da China · atualizado ${esc(LIVE.updated||'')}</div></a>

    <a class="minicard reveal" style="--i:2" href="#/cronologia"><div class="cn">年表</div><div class="ti">Cronologia</div><div class="ds">Do Século da Humilhação a 2026</div></a>

    ${byId[AI_ATLAS_ID]?`<a class="minicard reveal" style="--i:4" href="#/${AI_ATLAS_ID}"><div class="cn">人工智能</div><div class="ti">China AI Atlas</div><div class="ds">11 labs · 61 pesquisadores · US$ 223B</div></a>`:''}

/* ---- live ---- */

      <div class="ti">${esc(it.title)}</div>

/* ---- glossary ---- */
let glossFilter={q:'',letter:null};
function renderGlossary(){
  return `<div class="kicker">Apêndice A</div><h1 class="sec-title">Glossário expandido</h1><hr class="rule">
  <div class="gloss-controls">
    <input id="glossSearch" placeholder="Filtrar termos…" value="${esc(glossFilter.q)}" aria-label="Filtrar termos">
    <div class="alpha" id="alpha"></div>
  </div>
  <div id="glossList"></div>`;
}
function glossLetters(){
  const set=new Set(APOSTILA.glossary.map(g=>g.term[0].toUpperCase().normalize('NFD')[0]));
  return [...set].filter(c=>/[A-Z0-9]/.test(c)).sort();
}
function drawGloss(){
  const list=document.getElementById('glossList'); if(!list) return;
  const q=norm(glossFilter.q);
  let items=APOSTILA.glossary.filter(g=>{
    if(glossFilter.letter && g.term[0].toUpperCase().normalize('NFD')[0]!==glossFilter.letter) return false;
    if(q && !(norm(g.term).includes(q)||norm(g.def).includes(q)||(g.zh&&g.zh.includes(glossFilter.q)))) return false;
    return true;
  });
  let html='', curL='';
  items.forEach(g=>{
    const L=g.term[0].toUpperCase().normalize('NFD')[0];
    if(L!==curL){ curL=L; html+=`<div class="alpha-head">${esc(curL)}</div>`; }
    html+=`<div class="gloss-item">
      <span class="term-h">${esc(g.term)}</span>${g.zh?`<span class="zhp">${esc(g.zh)}</span>`:''}${g.pinyin?`<span class="py">${esc(g.pinyin)}</span>`:''}
      <div class="def">${wrapCJK(esc(g.def))}</div></div>`;
  });
  list.innerHTML=html||`<div class="sr-empty">Nenhum termo encontrado.</div>`;
  const al=document.getElementById('alpha');
  if(al && !al.dataset.built){ al.dataset.built='1';
    al.innerHTML=glossLetters().map(c=>`<button data-l="${c}">${c}</button>`).join('');
    al.onclick=e=>{const b=e.target.closest('button'); if(!b)return;
      glossFilter.letter = glossFilter.letter===b.dataset.l?null:b.dataset.l;
      al.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.l===glossFilter.letter));
      drawGloss();};
  }
}

/* ---- timeline ---- */
function renderTimeline(){
  let html='<div class="kicker">Apêndice B</div><h1 class="sec-title">Cronologia visual</h1>';
  html+='<div class="sec-sub">Do "Século da Humilhação" até 2026</div><hr class="rule">';
  APOSTILA.timeline.forEach(era=>{
    if(era.intro){ html+=`<p class="tl-note">${wrapCJK(esc(era.intro))}</p>`; return; }
    if(!era.items||!era.items.length) return;
    html+=`<div class="tl-era">${esc(era.era)}</div><div class="tl">`;
    era.items.forEach(it=>{
      if(!it.year){ html+=`<p class="tl-note">${wrapCJK(esc(it.text))}</p>`; return; }
      html+=`<div class="tl-item reveal"><span class="yr">${esc(it.year)}</span> — <span class="tx">${wrapCJK(esc(it.text))}</span></div>`;
    });
    html+='</div>';
  });
  return html;
}

/* ---- search ---- */
let CORPUS=null;
function buildCorpus(){
  CORPUS=[];
  SEC.forEach(s=>{
    if(/APÊNDICE A/.test(s.raw||'')) return;
    (s.blocks||[]).forEach((b,i)=>{
      const txt=b.text|| (b.rows?b.rows.flat().join(' '):'');
      if(txt&&txt.length>2) CORPUS.push({sid:s.id,slabel:s.label||'',stitle:s.title,bi:i,text:txt,n:norm(txt),isH:b.type==='h'});
    });
  });
  APOSTILA.glossary.forEach(g=>{
    CORPUS.push({sid:'glossario',slabel:'Glossário',stitle:g.term,bi:-1,text:g.term+' — '+g.def,n:norm(g.term+' '+g.def),gloss:true});
  });
}
let srSel=-1, srResults=[];
function doSearch(q){
  if(!CORPUS) buildCorpus();
  const nq=norm(q.trim());
  const panel=document.getElementById('searchPanel');
  if(nq.length<2){ srResults=[]; panel.innerHTML=`<div class="sr-empty">Digite ao menos 2 letras…</div>`; return; }
  const terms=nq.split(/\s+/);
  let res=[];
  for(const item of CORPUS){
    let ok=true,score=0;
    for(const t of terms){ const idx=item.n.indexOf(t); if(idx<0){ok=false;break;} score+= (item.isH||item.gloss?3:1); if(idx<60)score++; }
    if(ok){ res.push({item,score}); }
  }
  res.sort((a,b)=>b.score-a.score);
  res=res.slice(0,40);
  srResults=res; srSel=-1;
  if(!res.length){ panel.innerHTML=`<div class="sr-empty">Nada encontrado para "${esc(q)}".</div>`; return; }
  const meta=`<div class="sr-meta">${res.length} resultado(s) — Enter abre o primeiro, ↑↓ navega</div>`;
  panel.innerHTML=meta+res.map((r,i)=>{
    const it=r.item; const pos=it.n.indexOf(terms[0]);
    let start=Math.max(0,pos-40); let snip=it.text.slice(start,start+150);
    if(start>0)snip='…'+snip; if(start+150<it.text.length)snip+='…';
    let hs=esc(snip);
    terms.forEach(t=>{ if(t.length>1){ const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); hs=hs.replace(re,'<mark>$1</mark>'); }});
    const where=it.gloss?'Glossário':(it.slabel?it.slabel+' · ':'')+it.stitle;
    return `<a class="sr" data-i="${i}" href="#" onclick="openResult(${i});return false;"><span class="where">${esc(where)}</span><span class="snip">${hs}</span></a>`;
  }).join('');
}
function openResult(i){
  const r=srResults[i]; if(!r) return;
  const it=r.item;
  closeSearch();
  if(it.gloss){ go('glossario'); setTimeout(()=>{const el=document.getElementById('glossSearch');if(el){el.value=it.stitle;glossFilter.q=it.stitle;drawGloss();}},120); return; }
  pendingAnchor = it.bi>=0 ? `b-${it.sid}-${it.bi}` : null;
  if(CURRENT===it.sid){ if(pendingAnchor){const a=pendingAnchor;pendingAnchor=null;scrollToEl(a);} }
  else location.hash='#/'+it.sid;
}
function openSearch(){ document.getElementById('searchOverlay').classList.add('show'); }
function closeSearch(){ document.getElementById('searchOverlay').classList.remove('show'); }

/* ---- tooltip ---- */
const tip=document.getElementById('tip');
document.addEventListener('mouseover',e=>{
  const t=e.target.closest('.term'); if(!t||!t.dataset.def)return;
  tip.innerHTML=`<span class="tt">${esc(t.dataset.tt||'')}</span>${esc(t.dataset.def.split(' — ').slice(1).join(' — '))}`;
  tip.style.display='block'; requestAnimationFrame(()=>tip.style.opacity='1');
  moveTip(e);
});
document.addEventListener('mousemove',e=>{ if(tip.style.opacity==='1') moveTip(e); });
document.addEventListener('mouseout',e=>{ if(e.target.closest('.term')){ tip.style.opacity='0'; setTimeout(()=>{if(tip.style.opacity==='0')tip.style.display='none';},150);} });
function moveTip(e){
  let x=e.clientX+14,y=e.clientY+16;
  const r=tip.getBoundingClientRect();
  if(x+r.width>window.innerWidth-12)x=e.clientX-r.width-14;
  if(y+r.height>window.innerHeight-12)y=e.clientY-r.height-16;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}

/* ---- misc UI ---- */
function attachExtras(){
  if(CURRENT==='glossario'){
    const gs=document.getElementById('glossSearch');
    if(gs){ gs.oninput=()=>{glossFilter.q=gs.value;drawGloss();}; }
    drawGloss();
  }
}
function openNav(){ document.body.classList.add('nav-open'); }
function closeNav(){ document.body.classList.remove('nav-open'); }

/* progress bar */
function updateProgress(){
  const h=document.documentElement;
  const max=h.scrollHeight-h.clientHeight;
  const p=max>0?(h.scrollTop/max)*100:0;
  document.getElementById('progress').style.width=p+'%';
}

/* ============================================================
   REVEAL-ON-SCROLL + COUNT-UP
   ============================================================ */
let revealObs=null;
function observeReveals(){
  if(reducedMotion){
    document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
    document.querySelectorAll('[data-count]').forEach(el=>{
      const target=parseFloat(el.dataset.count);
      const suf=el.dataset.suffix||'';
      el.textContent=formatNum(target)+suf;
    });
    return;
  }
  if(!revealObs){
    revealObs=new IntersectionObserver((entries)=>{
      entries.forEach(en=>{
        if(en.isIntersecting){
          en.target.classList.add('in');
          if(en.target.dataset.count!==undefined){ countUp(en.target); }
          // Also count-up inside reveal blocks
          en.target.querySelectorAll && en.target.querySelectorAll('[data-count]').forEach(c=>{
            if(!c.dataset.counted) countUp(c);
          });
          revealObs.unobserve(en.target);
        }
      });
    },{rootMargin:'-60px 0px -10% 0px', threshold:0.05});
  }
  document.querySelectorAll('.reveal').forEach(el=>revealObs.observe(el));
  // standalone counters not inside a .reveal
  document.querySelectorAll('[data-count]').forEach(el=>{
    if(!el.closest('.reveal')) revealObs.observe(el);
  });
}
function formatNum(n){
  if(n>=1000) return n.toLocaleString('pt-BR');
  return String(n);
}
function countUp(el){
  if(el.dataset.counted) return;
  el.dataset.counted='1';
  const target=parseFloat(el.dataset.count);
  const suf=el.dataset.suffix||'';
  const dur=1100;
  const start=performance.now();
  function tick(t){
    const p=Math.min(1,(t-start)/dur);
    const eased=1-Math.pow(1-p,3);
    const v=Math.round(target*eased);
    el.textContent=formatNum(v)+suf;
    if(p<1) requestAnimationFrame(tick);
    else el.textContent=formatNum(target)+suf;
  }
  requestAnimationFrame(tick);
}

/* live refresh when served over http(s) */
async function tryRefreshLive(){
  if(!/^https?:/.test(location.protocol)) return;
  try{
    const r=await fetch('data/live.json',{cache:'no-store'});
    if(r.ok){ const j=await r.json(); if(j&&j.categories){ LIVE=j; if(CURRENT==='atualidades') document.getElementById('content').innerHTML=renderLive(); } }
  }catch(e){}
}

/* ---- init ---- */
function init(){
  buildSidebar();
  document.getElementById('menuBtn').onclick=openNav;
  document.getElementById('scrim').onclick=closeNav;

  const sb=document.getElementById('search');
  let deb;
  sb.addEventListener('input',()=>{ openSearch(); clearTimeout(deb); deb=setTimeout(()=>doSearch(sb.value),130); });
  sb.addEventListener('focus',()=>{ if(sb.value.trim().length>=2){openSearch();doSearch(sb.value);} });
  sb.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ closeSearch(); sb.blur(); }
    if(e.key==='Enter'){ if(srResults.length){ openResult(srSel>=0?srSel:0); } }
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault();
      srSel+= e.key==='ArrowDown'?1:-1; srSel=Math.max(0,Math.min(srResults.length-1,srSel));
      document.querySelectorAll('.sr').forEach((el,i)=>el.classList.toggle('kbd',i===srSel));
      const a=document.querySelector('.sr.kbd'); if(a)a.scrollIntoView({block:'nearest'});
    }
  });
  document.getElementById('searchOverlay').addEventListener('click',e=>{ if(e.target.id==='searchOverlay')closeSearch(); });
  document.addEventListener('keydown',e=>{
    if(e.key==='/' && document.activeElement!==sb){ e.preventDefault(); sb.focus(); }
    if(e.key==='Escape')closeSearch();
  });
  window.addEventListener('hashchange',render);
  window.addEventListener('scroll',updateProgress,{passive:true});
  render(); updateProgress(); tryRefreshLive();
}
window.go=go; window.scrollToEl=scrollToEl; window.openResult=openResult;
init();
</script>
